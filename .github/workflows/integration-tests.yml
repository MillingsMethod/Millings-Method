name: MLM Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/mlm_secure_pass_2026
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p mlm_secure_pass_2026 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.6.1
        ports:
          - 6333:6333
          - 6334:6334

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mlm_secure_pass_2026
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/ -v
